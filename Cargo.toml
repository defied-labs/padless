[workspace]
resolver = "3"
members = ["crates/padless-core", "crates/padless-platform"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/defied-labs/padless"
homepage = "https://github.com/defied-labs/padless"
keywords = ["keyboard", "alt-codes", "unicode", "input", "daemon"]
categories = ["command-line-utilities", "text-processing"]

[workspace.dependencies]
padless-core = { path = "crates/padless-core", version = "0.1.0" }
padless-platform = { path = "crates/padless-platform", version = "0.1.0" }
proptest = "1.11"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
windows = "0.62"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
dbg_macro = "warn"
expect_used = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
